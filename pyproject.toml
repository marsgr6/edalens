[project]
name = "edalens"
version = "0.1.0"
description = "Interactive exploratory data analysis with Streamlit and Plotly, in the browser or inside notebooks"
readme = "README.md"
requires-python = "==3.10.*"
license = "GPL-3.0-or-later"
authors = [{ name = "Mario González Rodríguez" }]
keywords = ["eda", "data-visualization", "streamlit", "plotly", "time-series", "jupyter", "notebook"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "matplotlib",
    "missingno",
    "numpy==1.26.4",
    "pandas",
    "plotly",
    "plotly-calheatmap",
    "plotly-calplot",
    "prophet",
    "requests",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "streamlit",
    "streamlit-option-menu",
]

[project.scripts]
edalens = "edalens.launcher:main"

[project.urls]
Homepage = "https://github.com/marsgr6/edalens"
Repository = "https://github.com/marsgr6/edalens"
Issues = "https://github.com/marsgr6/edalens/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Everything installs under the edalens namespace; the root my_viz_plotly.py
# (kept for `streamlit run` and Azure) stays out of the wheel.
packages = ["edalens", "edalens.views", "edalens.utils"]

[tool.ruff]
target-version = "py310"
include = ["my_viz_plotly.py", "edalens/**/*.py", "scripts/*.py", "tests/*.py"]

[tool.ruff.lint]
# Adopt correctness checks without reformatting or rewriting the existing app.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
